# Opt out of the parent stapler-scripts workspace so this package can be built independently.
# Remove this when kibitzer is added to the workspace members list.
[workspace]

[package]
name = "kibitzer"
version = "0.1.6"
edition = "2024"
description = "Advisory, diff-aware code/doc quality checks for AI agents, CI, and local dev"
repository = "https://github.com/tstapler/kibitzer"
homepage = "https://github.com/tstapler/kibitzer"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
pulldown-cmark = "0.13"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
rmcp = { version = "0.2", features = ["server", "transport-io"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
