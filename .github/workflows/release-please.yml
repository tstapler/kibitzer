name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (stored as RELEASE_PLEASE_TOKEN) is required, not the
          # default GITHUB_TOKEN: GitHub does not let a GITHUB_TOKEN-authored
          # push trigger other on:push workflows, but cargo-dist's generated
          # release.yml is a *separate* workflow that only triggers on
          # `push: tags:` — so the tag this action pushes on release must
          # come from a PAT for that trigger to fire. See stapler-squad's
          # release-please.yml for the incident this pattern avoids (a
          # GITHUB_TOKEN-pushed tag that silently never triggered a build).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
